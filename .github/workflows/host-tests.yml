name: Host tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check generated field tables
        run: |
          make generated
          git diff --exit-code -- include/sg_fields.h src/sg_fields.inc
      - run: make test
      - run: make sanitize
  cooling-mips:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc-mips-linux-gnu binutils-mips-linux-gnu
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build_firmware.py vendor/tp-link/tl-sg1218mpe-v5/20230616/TL-SG1218MPE-UN-V5-1.0.0-Build-20230616-up.bin --uart-cli --cooling-cli --output build-cooling
      - run: python tests/test_manual_cooling.py --build build-cooling
      - run: python tests/test_target.py vendor/tp-link/tl-sg1218mpe-v5/20230616/TL-SG1218MPE-UN-V5-1.0.0-Build-20230616-up.bin --build build-cooling
      - run: python tests/test_release_paths.py --build build-cooling
